<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon-Pong</title>
<link rel="stylesheet" href="shared/hub.css">
<style>
html,body{height:100%;overflow:hidden;background:#05030f}
body{display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px}
#cv{max-width:100%;max-height:100%;aspect-ratio:16/9;border-radius:16px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.7);cursor:none;touch-action:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;background:rgba(5,3,15,.7);backdrop-filter:blur(4px)}
.ov.hide{display:none}
.ov h1{margin:0;font-family:var(--font-display);font-size:70px;letter-spacing:6px;background:linear-gradient(90deg,#ff3d8b,#00f0ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(0,240,255,.4))}
.seg{display:flex;gap:3px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px}
.seg button{height:34px;padding:0 16px;border:0;border-radius:8px;background:transparent;color:var(--text-2);font-weight:700;font-size:13px;cursor:pointer}
.seg button.on{background:var(--text);color:#111}
.ov p{color:var(--text-2);margin:0}
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="1280" height="720"></canvas>
  <div class="ov" id="ov"><h1>NEON-PONG</h1><p id="ovText">Wer zuerst 7 Punkte hat, gewinnt.</p>
    <div class="seg" id="mode"><button data-m="ai">Gegen KI</button><button data-m="pvp">2 Spieler</button></div>
    <div class="seg" id="lvl"><button data-l="1">Leicht</button><button data-l="2">Mittel</button><button data-l="3">Schwer</button><button data-l="4">Unmöglich</button></div>
    <p style="font-size:13px">Links: <kbd>W</kbd> <kbd>S</kbd> oder Maus · Rechts: <kbd>↑</kbd> <kbd>↓</kbd> · <kbd>P</kbd> Pause</p>
    <button class="h-btn primary lg" id="go">Los geht’s</button></div>
</div>
<script src="shared/hub.js"></script>
<script src="shared/catalog.js"></script>
<script src="shared/catalog2.js"></script>
<script>
Hub.init('pong');
const bar = Hub.bar({id:'pong', title:'Neon-Pong', actions:['sound', 'full']});
const $ = id => document.getElementById(id), cv = $('cv'), ctx = cv.getContext('2d');
const W = 1280, H = 720, PW = 18, PH = 120, WIN = 7;
const opts = Object.assign({mode:'ai', lvl:2}, Hub.read('pong_opts', {}));
const C1 = '#ff3d8b', C2 = '#00f0ff';
let L, R, ball, trail = [], parts = [], state = 'menu', serveT = 0, server = 1, shake = 0, flash = 0, rally = 0, mouseY = null, paused = false;
const keys = {};
function reset(){ L = {y:H / 2, vy:0, score:0}; R = {y:H / 2, vy:0, score:0}; server = Math.random() < .5 ? 1 : -1; newBall(); }
function newBall(){ ball = {x:W / 2, y:H / 2, vx:0, vy:0, sp:560, spin:0}; serveT = 1.1; rally = 0; trail = []; }
function serve(){ const a = (Math.random() - .5) * .7; ball.vx = Math.cos(a) * ball.sp * server; ball.vy = Math.sin(a) * ball.sp; Hub.tone(440, .08, 'square', .03); }
function burst(x, y, col, n = 24, sp = 380){ for (let k = 0; k < n; k++){ const a = Math.random() * 6.283, s = Math.random() * sp; parts.push({x, y, vx:Math.cos(a) * s, vy:Math.sin(a) * s, life:.6 + Math.random() * .4, col}); } }
function movePaddle(p, up, down, dt, isLeft){
  const target = isLeft && mouseY != null && opts.mode !== 'pvp_mouse' ? mouseY : null;
  const before = p.y;
  if (target != null && !up && !down){ p.y += Math.max(-1100 * dt, Math.min(1100 * dt, target - p.y)); }
  else { const acc = (down ? 1 : 0) - (up ? 1 : 0); p.y += acc * 820 * dt; }
  p.y = Math.max(PH / 2, Math.min(H - PH / 2, p.y));
  p.vy = (p.y - before) / Math.max(dt, .001);
}
function ai(p, dt){
  const lv = opts.lvl, react = [0, .5, .78, .92, 1][lv], speed = [0, 420, 620, 820, 1200][lv];
  let target = H / 2;
  if (ball.vx > 0){
    // Vorhersage mit Banden-Reflexion
    let t = (W - 60 - ball.x) / ball.vx, y = ball.y + ball.vy * t;
    while (y < 0 || y > H){ if (y < 0) y = -y; if (y > H) y = 2 * H - y; }
    target = H / 2 + (y - H / 2) * react + (lv < 4 ? Math.sin(performance.now() / 500) * (4 - lv) * 18 : 0);
  }
  const before = p.y;
  p.y += Math.max(-speed * dt, Math.min(speed * dt, target - p.y));
  p.y = Math.max(PH / 2, Math.min(H - PH / 2, p.y));
  p.vy = (p.y - before) / Math.max(dt, .001);
}
function hitPaddle(p, x, dir, col){
  const rel = (ball.y - p.y) / (PH / 2);
  ball.sp = Math.min(1500, ball.sp * 1.06 + 12);
  const a = rel * .95;
  ball.vx = Math.cos(a) * ball.sp * dir; ball.vy = Math.sin(a) * ball.sp + p.vy * .25;
  ball.spin = p.vy * .0016;
  ball.x = x + dir * (PW / 2 + 12);
  rally++;
  burst(ball.x, ball.y, col, 16, 260); shake = Math.min(12, 3 + ball.sp / 250); flash = .08;
  Hub.tone(300 + rally * 18, .07, 'square', .04);
}
function point(side){
  const p = side === 'L' ? L : R; p.score++;
  burst(side === 'L' ? W - 10 : 10, ball.y, side === 'L' ? C1 : C2, 60, 600); shake = 18;
  Hub.tone(side === 'L' ? 660 : 200, .3, 'triangle', .05, 0, side === 'L' ? 990 : 120);
  server = side === 'L' ? -1 : 1;
  if (rally >= 20) Hub.achieve('pong', 'rally', 'Ballwechsel-Profi', 'Spiele einen Ballwechsel mit 20 Treffern');
  if (p.score >= WIN) return end(side);
  newBall();
}
function end(side){
  state = 'over';
  const youWin = side === 'L';
  let txt = opts.mode === 'ai' ? (youWin ? `Gewonnen ${L.score}:${R.score}!` : `Verloren ${L.score}:${R.score}`) : `${youWin ? 'Pink' : 'Cyan'} gewinnt ${Math.max(L.score, R.score)}:${Math.min(L.score, R.score)}!`;
  if (opts.mode === 'ai' && youWin){ Hub.sfx('ach'); Hub.score('pong', opts.lvl, {label:'Höchste KI-Stufe', silent:true}); Hub.achieve('pong', 'win', 'Pong-Champion', 'Besiege die KI'); if (opts.lvl >= 3) Hub.achieve('pong', 'hard', 'Reflexmonster', 'Besiege die KI auf Schwer'); if (opts.lvl === 4) Hub.achieve('pong', 'imp', 'Das Unmögliche', 'Besiege die KI auf Unmöglich'); if (R.score === 0) Hub.achieve('pong', 'zu0', 'Zu Null', 'Gewinne 7:0'); }
  $('ovText').textContent = txt; $('go').textContent = 'Nochmal';
  $('ov').classList.remove('hide');
}
function update(dt){
  if (state !== 'play' || paused) return;
  movePaddle(L, keys.w, keys.s, dt, true);
  if (opts.mode === 'pvp') movePaddle(R, keys.arrowup, keys.arrowdown, dt, false); else ai(R, dt);
  if (serveT > 0){ serveT -= dt; ball.x = W / 2; ball.y = H / 2 + Math.sin(performance.now() / 200) * 4; if (serveT <= 0) serve(); return; }
  const steps = Math.ceil(ball.sp * dt / 10);
  for (let k = 0; k < steps; k++){
    const d = dt / steps;
    ball.vy += ball.spin * ball.sp * d * 2; ball.spin *= Math.pow(.3, d);
    ball.x += ball.vx * d; ball.y += ball.vy * d;
    if (ball.y < 12){ ball.y = 12; ball.vy = Math.abs(ball.vy); Hub.tone(220, .04, 'sine', .03); burst(ball.x, 0, '#fff', 6, 140); }
    if (ball.y > H - 12){ ball.y = H - 12; ball.vy = -Math.abs(ball.vy); Hub.tone(220, .04, 'sine', .03); burst(ball.x, H, '#fff', 6, 140); }
    if (ball.vx < 0 && ball.x < 60 + PW / 2 + 12 && ball.x > 40 && Math.abs(ball.y - L.y) < PH / 2 + 12) hitPaddle(L, 60, 1, C1);
    if (ball.vx > 0 && ball.x > W - 60 - PW / 2 - 12 && ball.x < W - 40 && Math.abs(ball.y - R.y) < PH / 2 + 12) hitPaddle(R, W - 60, -1, C2);
    if (ball.x < -20) return point('R');
    if (ball.x > W + 20) return point('L');
  }
  trail.push({x:ball.x, y:ball.y}); if (trail.length > 18) trail.shift();
}
function draw(now){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#05030f'; ctx.fillRect(0, 0, W, H);
  if (shake) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  // Gitter
  ctx.strokeStyle = 'rgba(120,80,255,.07)'; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 40){ ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 40){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.setLineDash([16, 18]); ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke(); ctx.setLineDash([]);
  ctx.font = '700 120px Bahnschrift, sans-serif'; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,61,139,.22)'; ctx.fillText(L ? L.score : 0, W / 2 - 140, 140);
  ctx.fillStyle = 'rgba(0,240,255,.22)'; ctx.fillText(R ? R.score : 0, W / 2 + 140, 140);
  if (!L) return;
  ctx.globalCompositeOperation = 'lighter';
  const paddle = (x, p, col) => {
    ctx.fillStyle = col; ctx.globalAlpha = .25; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x - PW / 2 - 10, p.y - PH / 2 - 10, PW + 20, PH + 20, 18) : ctx.rect(x - PW / 2 - 10, p.y - PH / 2 - 10, PW + 20, PH + 20); ctx.fill();
    ctx.globalAlpha = 1; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x - PW / 2, p.y - PH / 2, PW, PH, 9) : ctx.rect(x - PW / 2, p.y - PH / 2, PW, PH); ctx.fill();
  };
  paddle(60, L, C1); paddle(W - 60, R, C2);
  trail.forEach((t, k) => { const a = k / trail.length; ctx.fillStyle = `rgba(${ball.vx > 0 ? '255,61,139' : '0,240,255'},${a * .5})`; ctx.beginPath(); ctx.arc(t.x, t.y, 12 * a, 0, 6.283); ctx.fill(); });
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(ball.x, ball.y, 22, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ball.x, ball.y, 11, 0, 6.283); ctx.fill();
  for (const p of parts){ ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.col; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (flash > 0){ ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, W, H); }
  if (state === 'play' && serveT > 0){ ctx.fillStyle = '#fff'; ctx.font = '700 46px Bahnschrift'; ctx.fillText(Math.ceil(serveT), W / 2, H / 2 - 50); }
  if (rally >= 5 && state === 'play'){ ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.font = '700 22px Bahnschrift'; ctx.fillText(`${rally}er Ballwechsel`, W / 2, H - 30); }
  if (paused){ ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#fff'; ctx.font = '700 60px Bahnschrift'; ctx.fillText('PAUSE', W / 2, H / 2); }
}
let last = performance.now();
function frame(now){
  const dt = Math.min(.03, (now - last) / 1000); last = now;
  update(dt);
  for (const p of parts){ p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .95; p.vy *= .95; }
  parts = parts.filter(p => p.life > 0);
  shake = Math.max(0, shake - dt * 40); flash = Math.max(0, flash - dt);
  draw(now); requestAnimationFrame(frame);
}
addEventListener('keydown', e => { const k = e.key.toLowerCase(); keys[k] = true; if (['arrowup', 'arrowdown', ' '].includes(k)) e.preventDefault(); if (k === 'p' && state === 'play') paused = !paused; if (k === 'w' || k === 's') mouseY = null; });
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
cv.addEventListener('pointermove', e => { const r = cv.getBoundingClientRect(); mouseY = (e.clientY - r.top) / r.height * H; });
function syncOpts(){ document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('on', b.dataset.m === opts.mode)); document.querySelectorAll('#lvl button').forEach(b => b.classList.toggle('on', +b.dataset.l === opts.lvl)); $('lvl').style.display = opts.mode === 'ai' ? '' : 'none'; }
$('mode').onclick = e => { const b = e.target.closest('button'); if (b){ opts.mode = b.dataset.m; Hub.write('pong_opts', opts); syncOpts(); } };
$('lvl').onclick = e => { const b = e.target.closest('button'); if (b){ opts.lvl = +b.dataset.l; Hub.write('pong_opts', opts); syncOpts(); } };
$('go').onclick = () => { Hub.audio(); reset(); state = 'play'; paused = false; $('ov').classList.add('hide'); };
syncOpts(); requestAnimationFrame(frame);
</script>
</body>
</html>
