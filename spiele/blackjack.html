<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blackjack</title>
<link rel="stylesheet" href="shared/hub.css">
<style>
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;background:#06120c}
#table{position:relative;flex:1;min-height:0;margin:12px;border-radius:0 0 300px 300px / 0 0 120px 120px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 20%,#1f8a55,#0f5a34 55%,#093a22);box-shadow:inset 0 0 0 12px #4a2c18,inset 0 0 0 15px #2b190c,inset 0 30px 80px rgba(0,0,0,.4),0 20px 60px rgba(0,0,0,.6);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:24px 20px 20px;--cw:min(86px,8.5vh)}
.zone{display:flex;flex-direction:column;align-items:center;gap:8px}
.zone h4{margin:0;font-size:12px;letter-spacing:2px;color:rgba(255,255,255,.55);font-weight:700}
.hand{display:flex;justify-content:center;min-height:calc(var(--cw) * 1.4)}
.hand .pcard{margin-left:calc(var(--cw) * -.6)}
.hand .pcard:first-child{margin-left:0}
.val{display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:26px;padding:0 9px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;font-family:var(--font-display);font-weight:600;font-size:15px}
.val.bust{background:#c4202f}.val.bj{background:linear-gradient(90deg,#ffd23f,#ff9a2e);color:#2a1c00}
.mid{text-align:center;color:rgba(255,230,160,.55);font-family:var(--font-display);letter-spacing:3px;font-size:13px;line-height:1.8}
.mid b{display:block;font-size:24px;letter-spacing:6px;color:rgba(255,230,160,.75)}
.shoe{position:absolute;right:40px;top:26px;width:86px;height:104px;border-radius:12px;background:linear-gradient(160deg,#3a2414,#1e120a);box-shadow:0 10px 20px rgba(0,0,0,.5)}
.shoe::after{content:'';position:absolute;left:12px;right:12px;top:14px;height:66px;border-radius:6px;background:repeating-linear-gradient(45deg,#8b1d2c 0 6px,#a8243a 6px 12px);border:3px solid #fff}
/* Plätze */
.seats{display:flex;gap:12px;justify-content:center;align-items:flex-end;flex-wrap:nowrap;width:100%}
.seat{flex:1 1 0;max-width:300px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 6px 10px;border-radius:18px;transition:.25s;border:2px solid transparent}
.seat.act{background:rgba(255,255,255,.08);border-color:var(--pc,#ffd23f);box-shadow:0 0 30px color-mix(in srgb,var(--pc,#ffd23f) 40%,transparent)}
.seat.out{opacity:.35}
.seat .hands{display:flex;gap:10px;justify-content:center;--cw:min(70px,7vh)}
.seats.few .seat .hands{--cw:min(86px,8.5vh)}
.seat .hbox{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px;border-radius:12px}
.seat .hbox.act{background:rgba(255,210,63,.18);box-shadow:0 0 0 2px #ffd23f}
.seat .res{font-family:var(--font-display);font-size:15px;font-weight:700;min-height:18px}
.res.w{color:#ffd23f}.res.l{color:#ff8a95}.res.p{color:#cfe}
.seat .tag{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:rgba(0,0,0,.45);border:2px solid var(--pc,rgba(255,255,255,.2))}
.seat .tag .av{width:30px;height:30px;border-radius:50%;background:var(--pc,#555);display:flex;align-items:center;justify-content:center;font-size:18px;font-family:'Segoe UI Emoji'}
.seat .tag b{font-size:14px}
.seat .tag span{font-family:var(--font-display);color:#ffd23f;font-size:14px}
.seat .betc{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;background:rgba(255,210,63,.22);font-family:var(--font-display);font-weight:700;font-size:14px;min-height:22px}
.seat .betc:empty{visibility:hidden}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 16px 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.who{font-family:var(--font-display);font-size:20px;min-height:26px;text-align:center}
.who b{color:var(--pc,#fff)}
.betbox{min-width:130px;text-align:center;font-family:var(--font-display)}
.betbox small{display:block;color:var(--muted);font-size:11px;letter-spacing:1.5px;font-weight:700}
.betbox b{font-size:24px}
.msgbig{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.7);font-family:var(--font-display);font-size:60px;font-weight:700;color:#ffd23f;text-shadow:0 0 30px rgba(255,210,63,.6),0 5px 0 #8a5a00;opacity:0;pointer-events:none;white-space:nowrap;z-index:5}
.msgbig.on{animation:bigp 1.8s ease}
@keyframes bigp{15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2)}}
.modeSel{position:absolute;left:20px;top:20px;display:flex;gap:6px;z-index:4}
.modeSel button{height:34px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.35);color:#fff;font-weight:700;cursor:pointer}
.modeSel button.on{background:#fff;color:#111}
html.tv .ctrl,html.tv .modeSel{zoom:var(--tvz,1.3)}
html.tv .seat .tag b,html.tv .seat .tag span{font-size:17px}
</style>
</head>
<body>
<div id="table">
  <div class="modeSel" id="modeSel"><button data-m="solo">👤 Solo (Konto-Chips)</button><button data-m="party">👥 Partyrunde</button></div>
  <div class="shoe" id="shoe"></div>
  <div class="zone"><h4>BANK</h4><div class="hand" id="dealer"></div><span class="val" id="dval" style="visibility:hidden">0</span></div>
  <div class="mid"><b>BLACKJACK</b>ZAHLT 3 ZU 2 · BANK STEHT AUF 17</div>
  <div class="seats" id="seats"></div>
  <div class="msgbig" id="big"></div>
</div>
<div class="ctrl">
  <div class="who" id="who"></div>
  <div class="row" id="betRow"><div class="row" id="chips"></div><div class="betbox"><small>EINSATZ</small><b id="bet">0</b></div><button class="h-btn ghost" id="clear">Löschen</button><button class="h-btn ghost" id="rebet">Wie zuvor</button><button class="h-btn ghost" id="skip">Aussetzen</button><button class="h-btn primary lg" id="deal">Geben</button></div>
  <div class="row" id="playRow" style="display:none"><button class="h-btn lg" id="hit">Karte (H)</button><button class="h-btn lg" id="stand">Stehen (S)</button><button class="h-btn lg" id="dbl">Verdoppeln (D)</button><button class="h-btn lg" id="split">Teilen (P)</button></div>
  <div class="row" id="endRow" style="display:none"><button class="h-btn" id="partyEnd">🏁 Spieleabend beenden & Siegerehrung</button></div>
</div>
<script src="shared/hub.js"></script>
<script src="shared/catalog.js"></script>
<script src="shared/catalog2.js"></script>
<script src="shared/catalog3.js"></script>
<script src="shared/catalog4.js"></script>
<script src="shared/cards.js"></script>
<script>
Hub.init('blackjack'); Hub.casinoInit();
const bar = Hub.bar({id:'blackjack', title:'Blackjack', stats:[['chips', 'Chips'], ['streak', 'Siegesserie'], ['hands', 'Gewonnen']], actions:['help', 'sound', 'full']});
bar.on('help', () => Hub.dialog({title:'Blackjack', html:'<p>Ziel: näher an <b>21</b> kommen als die Bank, ohne darüber zu gehen. Bildkarten zählen 10, Asse 1 oder 11.</p><p><b>Karte</b> zieht eine weitere Karte, <b>Stehen</b> beendet den Zug. <b>Verdoppeln</b>: doppelter Einsatz, genau eine Karte. <b>Teilen</b>: zwei gleiche Karten werden zu zwei Händen.</p><p>Ein <b>Blackjack</b> (Ass + 10er mit den ersten zwei Karten) zahlt 3 zu 2. Die Bank zieht bis 16 und bleibt ab 17 stehen.</p><p><b>Partyrunde:</b> Alle aus dem Partyraum sitzen am Tisch – jeder mit 1.000 Partychips. Erst setzen alle reihum, dann spielt jeder seine Hand gegen die Bank.</p><p><i>Nur Spielgeld.</i></p>'}));
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
const st = Object.assign({streak:0, won:0}, Hub.read('bj_stats', {}));
let MODE = 'solo', seats = [], shoe = [], dealer = [], state = 'bet', bIdx = 0, pIdx = 0, hIdx = 0, busy = false;

function newShoe(){ shoe = HubCards.deck(6); Hub.toast('Neuer Kartenschlitten', '6 Decks werden gemischt', 'sparkles'); }
const draw = () => { if (shoe.length < 80) newShoe(); return shoe.pop(); };
function value(cs){ let v = 0, a = 0; cs.forEach(c => { if (c.down) return; v += c.r === 14 ? 11 : Math.min(10, c.r); if (c.r === 14) a++; }); while (v > 21 && a){ v -= 10; a--; } return v; }
const soft = cs => { let v = 0, a = 0; cs.forEach(c => { v += c.r === 14 ? 11 : Math.min(10, c.r); if (c.r === 14) a++; }); while (v > 21 && a){ v -= 10; a--; } return a > 0 && v <= 21; };
const isBJ = cs => cs.length === 2 && value(cs) === 21;
// Kontostand: Solo = Spielhallen-Konto, Party = eigener Stapel
const stack = s => MODE === 'solo' ? Hub.chips.get() : s.stack;
function addStack(s, v){ if (MODE === 'solo') Hub.chips.add(v); else s.stack += v; }

// ---------- Plätze ----------
function setupSolo(){ MODE = 'solo'; seats = [{name:Hub.settings.name || 'Du', av:'😎', col:null, stack:0, bet:Math.min(50, Hub.chips.get()), lastBet:50, hands:[]}]; }
function setupParty(){
  const act = Hub.party.active().slice(0, 6);
  if (act.length < 1){ Hub.toast('Partyrunde leer', 'Lege im Partyraum fest, wer dabei ist.', 'user'); return setupSolo(); }
  MODE = 'party';
  seats = act.map(pp => ({name:pp.name, av:pp.avatar, col:pp.color, stack:1000, bet:50, lastBet:50, hands:[], won:0}));
}
function render(){
  const box = $('seats'); box.classList.toggle('few', seats.length <= 3);
  box.innerHTML = seats.map((s, i) => `<div class="seat ${state === 'bet' && i === bIdx || state === 'play' && i === pIdx ? 'act' : ''} ${MODE === 'party' && s.stack <= 0 && !s.bet ? 'out' : ''}" id="seat${i}" style="${s.col ? `--pc:${s.col}` : ''}">
    <div class="hands" id="hands${i}">${s.hands.map((h, k) => `<div class="hbox ${state === 'play' && i === pIdx && k === hIdx && s.hands.length > 1 ? 'act' : ''}"><div class="hand" data-s="${i}" data-h="${k}"></div><span class="val" data-v="${i}-${k}">0</span><div class="res" data-r="${i}-${k}"></div></div>`).join('')}</div>
    <div class="betc">${s.hands.length ? (s.hands.length > 1 ? s.hands.map(h => '● ' + Hub.chips.fmt(h.bet)).join(' / ') : '● ' + Hub.chips.fmt(s.hands[0].bet)) : s.bet ? '● ' + Hub.chips.fmt(s.bet) : ''}</div>
    <div class="tag"><span class="av">${s.av}</span><b>${s.name}</b><span>${Hub.chips.fmt(stack(s))}</span></div></div>`).join('');
  seats.forEach((s, i) => s.hands.forEach((h, k) => { const el = box.querySelector(`.hand[data-s="${i}"][data-h="${k}"]`); h.cards.forEach(c => { const e = HubCards.el(c, false); if (c.rot) e.style.transform = 'rotate(90deg)'; el.appendChild(e); c.el = e; }); h.box = el; updVal(i, k); }));
  upd();
}
function updVal(i, k){
  const h = seats[i].hands[k], v = value(h.cards), el = $('seats').querySelector(`[data-v="${i}-${k}"]`); if (!el) return;
  el.textContent = isBJ(h.cards) && !h.split ? 'BJ' : (soft(h.cards) && v < 21 ? `${v - 10}/${v}` : v);
  el.className = 'val' + (v > 21 ? ' bust' : isBJ(h.cards) && !h.split ? ' bj' : '');
  if (h.res){ const r = $('seats').querySelector(`[data-r="${i}-${k}"]`); r.textContent = h.res[0]; r.className = 'res ' + h.res[1]; }
}
function updDealer(){
  const v = value(dealer), el = $('dval'); el.style.visibility = dealer.length ? 'visible' : 'hidden';
  el.textContent = dealer.some(c => c.down) ? v : (isBJ(dealer) ? 'BJ' : v);
  el.className = 'val' + (v > 21 ? ' bust' : !dealer.some(c => c.down) && isBJ(dealer) ? ' bj' : '');
}
function upd(){
  const s = seats[bIdx] || seats[0];
  bar.set('chips', Hub.chips.fmt(MODE === 'solo' ? Hub.chips.get() : seats.reduce((a, x) => a + x.stack, 0))); bar.set('streak', st.streak); bar.set('hands', st.won);
  bar.el.querySelector('[data-k="chips"] small').textContent = MODE === 'solo' ? 'Chips' : 'Chips am Tisch';
  $('betRow').style.display = state === 'bet' ? '' : 'none';
  $('playRow').style.display = state === 'play' ? '' : 'none';
  $('endRow').style.display = MODE === 'party' && state === 'bet' ? '' : 'none';
  $('skip').style.display = MODE === 'party' ? '' : 'none';
  document.querySelectorAll('#modeSel button').forEach(b => b.classList.toggle('on', b.dataset.m === MODE));
  if (state === 'bet' && s){
    $('bet').textContent = Hub.chips.fmt(s.bet);
    const c = stack(s);
    $('chips').innerHTML = HubCards.CHIPS.map(([v, col]) => `<div class="chip ${v > c - s.bet ? 'off' : ''}" style="--c:${col}" data-v="${v}">${v >= 1000 ? '1K' : v}</div>`).join('');
    $('deal').textContent = MODE === 'party' && nextBetter(bIdx) >= 0 ? 'Fertig ➜' : 'Geben';
    $('deal').disabled = s.bet <= 0 && MODE === 'solo';
    $('who').innerHTML = MODE === 'party' ? `<span style="--pc:${s.col}">${s.av} <b>${s.name}</b> setzt …</span>` : '';
  }
  if (state === 'play'){
    const p = seats[pIdx], h = p && p.hands[hIdx];
    $('who').innerHTML = p ? `<span style="--pc:${p.col || '#fff'}">${p.av} <b>${p.name}</b>${p.hands.length > 1 ? ` – Hand ${hIdx + 1}` : ''} ist dran</span>` : '';
    if (h){
      $('dbl').disabled = h.cards.length !== 2 || stack(p) < h.bet || busy;
      $('split').disabled = !(h.cards.length === 2 && Math.min(10, h.cards[0].r) === Math.min(10, h.cards[1].r) && p.hands.length < 2 && stack(p) >= h.bet) || busy;
      $('hit').disabled = $('stand').disabled = busy;
    }
  }
  if (state === 'dealer') $('who').textContent = 'Die Bank spielt …';
}
const nextBetter = i => { for (let k = i + 1; k < seats.length; k++) if (MODE === 'solo' || seats[k].stack > 0) return k; return -1; };
function big(t){ const b = $('big'); b.textContent = t; b.classList.remove('on'); void b.offsetWidth; b.classList.add('on'); }
async function addCard(target, card, down){
  card.down = !!down;
  const el = HubCards.el(card, down); target.appendChild(el);
  const sr = $('shoe').getBoundingClientRect(), er = el.getBoundingClientRect();
  el.style.transition = 'none'; el.style.transform = `translate(${sr.left - er.left}px,${sr.top - er.top}px) rotate(-20deg) scale(.8)`; el.style.opacity = '0';
  void el.offsetWidth; el.style.transition = ''; el.style.transform = card.rot ? 'rotate(90deg)' : ''; el.style.opacity = '1';
  Hub.tone(1400 + Math.random() * 300, .03, 'triangle', .03);
  card.el = el; await wait(300);
}

// ---------- Setzen ----------
$('chips').onclick = e => { const v = +e.target.dataset.v, s = seats[bIdx]; if (!v || state !== 'bet') return; if (s.bet + v > stack(s)) return; s.bet += v; Hub.tone(900, .04, 'triangle', .04); render(); };
$('clear').onclick = () => { if (state !== 'bet') return; seats[bIdx].bet = 0; render(); };
$('rebet').onclick = () => { if (state !== 'bet') return; const s = seats[bIdx]; s.bet = Math.min(s.lastBet, stack(s)); render(); };
$('skip').onclick = () => { if (state !== 'bet') return; seats[bIdx].bet = 0; betDone(); };
$('deal').onclick = () => betDone();
function betDone(){
  if (state !== 'bet') return;
  const s = seats[bIdx];
  if (MODE === 'solo' && (s.bet <= 0 || s.bet > stack(s))) return;
  const n = nextBetter(bIdx);
  if (MODE === 'party' && n >= 0){ bIdx = n; Hub.sfx('click'); render(); return; }
  if (!seats.some(x => x.bet > 0)){ Hub.toast('Niemand setzt', 'Mindestens einer muss etwas setzen.', 'coins'); bIdx = firstBetter(); render(); return; }
  deal();
}
const firstBetter = () => { const k = seats.findIndex(s => MODE === 'solo' || s.stack > 0); return k < 0 ? 0 : k; };

// ---------- Runde ----------
async function deal(){
  state = 'deal'; busy = true; dealer = [];
  seats.forEach(s => { if (s.bet > 0){ addStack(s, -s.bet); s.lastBet = s.bet; s.hands = [{cards:[], bet:s.bet}]; } else s.hands = []; });
  $('dealer').innerHTML = ''; render(); upd();
  const playing = seats.map((s, i) => i).filter(i => seats[i].hands.length);
  for (let r = 0; r < 2; r++){
    for (const i of playing){ const h = seats[i].hands[0], c = draw(); h.cards.push(c); await addCard(h.box, c); updVal(i, 0); }
    const c = draw(); dealer.push(c); await addCard($('dealer'), c, r === 1); updDealer();
  }
  busy = false;
  const dBJ = isBJ(dealer.map(c => ({...c, down:false})));
  if (dBJ) return dealerTurn();
  state = 'play'; pIdx = -1; hIdx = 0; nextHand();
}
function nextHand(){
  // nächste offene Hand suchen
  for (;;){
    const p = seats[pIdx];
    if (p && hIdx < p.hands.length - 1){ hIdx++; }
    else { pIdx++; hIdx = 0; while (pIdx < seats.length && !seats[pIdx].hands.length) pIdx++; }
    if (pIdx >= seats.length) return dealerTurn();
    const h = seats[pIdx].hands[hIdx];
    if (isBJ(h.cards) && !h.split) continue;
    if (value(h.cards) >= 21) continue;
    break;
  }
  render(); upd();
  const p = seats[pIdx];
  if (MODE === 'party'){ Hub.tone(523, .08, 'triangle', .04); Hub.tone(784, .1, 'triangle', .04, .08); }
}
async function hit(){
  if (busy || state !== 'play') return;
  busy = true; upd();
  const p = seats[pIdx], h = p.hands[hIdx], c = draw(); h.cards.push(c); await addCard(h.box, c); updVal(pIdx, hIdx);
  busy = false;
  const v = value(h.cards);
  if (v > 21){ Hub.tone(200, .2, 'sawtooth', .03); return setTimeout(nextHand, 400); }
  if (v === 21 || (h.split && h.cards[0].r === 14)) return setTimeout(nextHand, 300);
  upd();
}
function stand(){ if (busy || state !== 'play') return; nextHand(); }
async function dbl(){
  const p = seats[pIdx], h = p.hands[hIdx]; if (busy || state !== 'play' || h.cards.length !== 2 || stack(p) < h.bet) return;
  addStack(p, -h.bet); h.bet *= 2; h.doubled = true; busy = true; render();
  const c = draw(); c.rot = true; h.cards.push(c); await addCard(seats[pIdx].hands[hIdx].box, c); updVal(pIdx, hIdx);
  busy = false; setTimeout(nextHand, 400);
}
async function split(){
  const p = seats[pIdx], h = p.hands[hIdx]; if (busy || state !== 'play' || h.cards.length !== 2 || p.hands.length > 1) return;
  if (Math.min(10, h.cards[0].r) !== Math.min(10, h.cards[1].r) || stack(p) < h.bet) return;
  addStack(p, -h.bet);
  p.hands = [{cards:[h.cards[0]], bet:h.bet, split:true}, {cards:[h.cards[1]], bet:h.bet, split:true}];
  render(); busy = true;
  for (let k = 0; k < 2; k++){ const c = draw(); p.hands[k].cards.push(c); await addCard(p.hands[k].box, c); updVal(pIdx, k); }
  busy = false; hIdx = 0;
  if (p.hands[0].cards[0].r === 14){ hIdx = 1; return nextHand(); }
  render(); upd();
}
async function dealerTurn(){
  state = 'dealer'; busy = true; render(); upd();
  const hc = dealer.find(c => c.down);
  if (hc){ hc.down = false; hc.el.classList.remove('down'); Hub.tone(1100, .04, 'triangle', .03); updDealer(); await wait(500); }
  const live = seats.some(s => s.hands.some(h => value(h.cards) <= 21 && !(isBJ(h.cards) && !h.split)));
  if (live && !isBJ(dealer)) while (value(dealer) < 17){ const c = draw(); dealer.push(c); await addCard($('dealer'), c); updDealer(); await wait(250); }
  settle();
}
function settle(){
  const dv = value(dealer), dBJ = isBJ(dealer);
  let anyWin = false, anyLoss = false;
  seats.forEach((s, i) => s.hands.forEach((h, k) => {
    const v = value(h.cards), bj = isBJ(h.cards) && !h.split;
    let pay = 0, txt, cls;
    if (v > 21){ txt = 'Überkauft'; cls = 'l'; }
    else if (bj && !dBJ){ pay = h.bet * 2.5; txt = 'BLACKJACK!'; cls = 'w'; }
    else if (dBJ && !bj){ txt = 'Bank hat BJ'; cls = 'l'; }
    else if (dv > 21 || v > dv){ pay = h.bet * 2; txt = 'Gewonnen'; cls = 'w'; }
    else if (v === dv){ pay = h.bet; txt = 'Unentschieden'; cls = 'p'; }
    else { txt = 'Verloren'; cls = 'l'; }
    h.res = [txt + (pay > h.bet ? ` +${Hub.chips.fmt(pay - h.bet)}` : ''), cls];
    if (pay) addStack(s, pay);
    if (cls === 'w'){ anyWin = true; st.won++; s.won = (s.won || 0) + 1; } if (cls === 'l') anyLoss = true;
    if (bj && !dBJ){ big(MODE === 'party' ? `${s.name}: BLACKJACK!` : 'BLACKJACK!'); Hub.achieve('blackjack', 'bj', 'Blackjack!', 'Ziehe einen Blackjack'); }
    if (h.doubled && cls === 'w') Hub.achieve('blackjack', 'dbl', 'Mutig verdoppelt', 'Gewinne eine verdoppelte Hand');
    if (cls === 'w' && h.cards.length >= 5) Hub.achieve('blackjack', 'five', 'Fünf-Karten-Trick', 'Gewinne mit fünf oder mehr Karten');
  }));
  if (anyWin && !anyLoss){ st.streak++; Hub.sfx('ok'); } else if (anyLoss && !anyWin){ st.streak = 0; Hub.sfx('bad'); } else Hub.sfx('ok');
  if (dv > 21 && !$('big').classList.contains('on')) big('BANK ÜBERKAUFT');
  if (MODE === 'solo'){
    if (st.streak >= 5) Hub.achieve('blackjack', 's5', 'Glückssträhne', 'Gewinne 5 Runden in Folge');
    if (Hub.chips.get() >= 10000) Hub.achieve('blackjack', 'rich', 'High Roller', 'Besitze 10 000 Chips');
    Hub.score('blackjack', Hub.chips.get(), {label:'Chips', silent:true});
  }
  Hub.write('bj_stats', st);
  render();
  setTimeout(() => {
    state = 'bet'; busy = false;
    seats.forEach(s => { s.bet = Math.min(s.lastBet, stack(s)); });
    if (MODE === 'party' && seats.filter(s => s.stack > 0).length === 0) return partyEnd();
    bIdx = firstBetter();
    if (MODE === 'solo' && Hub.chips.get() <= 0) broke();
    render();
  }, 1800);
}
async function partyEnd(){
  const rank = seats.slice().sort((a, b) => b.stack - a.stack);
  Hub.sfx('ach'); Hub.achieve('blackjack', 'party', 'Casinoabend', 'Spiele Blackjack mit der Partyrunde');
  const r = await Hub.dialog({title:`🏆 ${rank[0].name} sprengt die Bank!`, center:true, dismiss:false,
    html:rank.map((s, k) => `<p style="font-size:18px">${['🥇', '🥈', '🥉'][k] || (k + 1) + '.'} <b style="color:${s.col}">${s.av} ${s.name}</b>: ${Hub.chips.fmt(s.stack)} Chips</p>`).join(''),
    buttons:[{label:'Zur Spielhalle', value:'home'}, {label:'Neue Runde', primary:true, value:'new'}]});
  if (r === 'new'){ setupParty(); state = 'bet'; bIdx = firstBetter(); dealer = []; $('dealer').innerHTML = ''; updDealer(); render(); }
  else location.href = '../Launcher.html';
}
async function broke(){
  const r = Hub.chips.rescue();
  if (r > 0) Hub.dialog({title:'Pleite!', center:true, html:`<p>Keine Chips mehr – die Spielhalle schenkt dir <b>${r} Chips</b> Nachschub.</p>`}).then(render);
  else Hub.dialog({title:'Pleite!', center:true, html:`<p>Nachschub gibt es wieder in ${-r} Sekunden. Kurze Pause?</p>`});
}
$('hit').onclick = hit; $('stand').onclick = stand; $('dbl').onclick = dbl; $('split').onclick = split;
$('partyEnd').onclick = () => partyEnd();
$('modeSel').onclick = e => {
  const m = e.target.dataset.m; if (!m || m === MODE || state !== 'bet') return;
  if (m === 'party') setupParty(); else setupSolo();
  bIdx = firstBetter(); dealer = []; $('dealer').innerHTML = ''; updDealer(); render(); Hub.sfx('click');
};
addEventListener('keydown', e => {
  if (document.querySelector('.h-overlay.on')) return;
  if (state === 'play'){ if (e.code === 'KeyH') hit(); if (e.code === 'KeyS') stand(); if (e.code === 'KeyD') dbl(); if (e.code === 'KeyP') split(); }
  if (state === 'bet' && (e.code === 'Enter' || e.code === 'Space')){ e.preventDefault(); const s = seats[bIdx]; if (!s.bet && MODE === 'solo') s.bet = Math.min(s.lastBet, stack(s)); betDone(); }
});
document.addEventListener('hubchips', () => { if (MODE === 'solo') render(); });
newShoe();
if (Hub.party.wantsParty('blackjack')) setupParty(); else setupSolo();
bIdx = firstBetter(); render();
if (MODE === 'solo' && Hub.chips.get() <= 0) broke();
</script>
</body>
</html>
