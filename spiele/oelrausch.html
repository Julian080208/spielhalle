<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ölrausch</title>
<link rel="stylesheet" href="shared/hub.css">
<style>
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;background:#0c0806;--oil:#ffb04a;user-select:none}
.h-bar{background:rgba(14,10,7,.92);border-bottom-color:rgba(255,200,140,.08);gap:8px}
.h-bar .seg{padding:3px}
.h-bar .seg button{height:30px}
.navseg{margin-left:6px}
#hud{flex-wrap:nowrap!important;overflow:hidden}
#hud{display:flex;gap:8px;padding:8px 12px;background:linear-gradient(180deg,#18110c,#120d09);border-bottom:1px solid rgba(255,200,140,.08);align-items:stretch;flex-wrap:wrap;z-index:5}
.hc{background:rgba(255,255,255,.035);border:1px solid rgba(255,220,180,.08);border-radius:12px;padding:6px 12px;display:flex;flex-direction:column;justify-content:center;min-width:110px}
.hc small{font-size:10px;letter-spacing:1.1px;font-weight:700;text-transform:uppercase;color:#a48a70;white-space:nowrap}
.hc b{font-family:var(--font-display);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.hc.wide{min-width:190px;flex:1;max-width:280px}
.hc.money b{color:#ffcf5a}
.pr{height:6px;background:rgba(0,0,0,.45);border-radius:4px;overflow:hidden;margin-top:5px;position:relative}
.pr i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb04a,#ff7a2a);transition:width .3s}
.pr.goal i{background:linear-gradient(90deg,#2fbf71,#9ef0c4)}
.pr .mk{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.6)}
.price{flex-direction:row;align-items:center;gap:10px}
.price canvas{width:84px;height:30px}
.price.best{border-color:rgba(63,210,139,.55);box-shadow:inset 0 0 0 1px rgba(63,210,139,.25)}
.price .tr{font-size:12px;font-weight:700}
.seg{display:flex;gap:3px;align-items:center;background:rgba(255,255,255,.035);border:1px solid rgba(255,220,180,.08);border-radius:12px;padding:4px}
.seg .lbl{font-size:10px;letter-spacing:1px;font-weight:700;text-transform:uppercase;color:#a48a70;padding:0 6px}
.seg button{height:32px;min-width:34px;padding:0 10px;border-radius:8px;border:0;background:transparent;color:#c2ad96;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button:hover{background:rgba(255,255,255,.06)}
.seg button.on{background:var(--oil);color:#2a1600}
.seg button .ico{width:15px;height:15px}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:default}
#dock{display:flex;gap:10px;padding:10px 12px;background:linear-gradient(0deg,#18110c,#120d09);border-top:1px solid rgba(255,200,140,.08);align-items:stretch;z-index:5}
#mini{width:270px;height:66px;border-radius:10px;border:1px solid rgba(255,220,180,.12);cursor:pointer;flex:none;background:#000}
.tools{display:flex;gap:8px}
.tool{position:relative;width:88px;border-radius:12px;border:1px solid rgba(255,220,180,.1);background:linear-gradient(180deg,#2a1f16,#1d1610);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:6px 4px;color:#eadccb;transition:transform .12s,border-color .12s,box-shadow .12s}
.tool:hover{border-color:rgba(255,190,120,.4);transform:translateY(-2px)}
.tool.on{border-color:var(--oil);box-shadow:inset 0 0 0 1px var(--oil),0 8px 24px rgba(255,140,40,.25);background:linear-gradient(180deg,#3d2a18,#26190f)}
.tool svg{width:30px;height:30px}
.tool b{font-size:12px;font-weight:700}
.tool small{font-size:11px;color:#ffcf5a;font-weight:700;font-variant-numeric:tabular-nums}
.tool.poor small{color:#ff6b6b}
.tool kbd{position:absolute;top:4px;right:5px;font-size:9px;padding:0 4px;line-height:14px}
#sel{flex:1;min-width:260px;border-radius:12px;border:1px solid rgba(255,220,180,.1);background:rgba(255,255,255,.03);padding:8px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px;color:#d9c8b5}
#sel .t{font-family:var(--font-display);font-size:16px;font-weight:600;color:#fff}
#sel .gauge{width:120px;height:8px;border-radius:5px;background:rgba(0,0,0,.5);overflow:hidden}
#sel .gauge i{display:block;height:100%;background:linear-gradient(90deg,#5c5c78,#16151d)}
#sel .muted{color:#a48a70}
#feed{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:440px;z-index:3}
.fd{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 10px;border-radius:12px;background:rgba(20,14,10,.88);backdrop-filter:blur(8px);border:1px solid rgba(255,220,180,.1);font-size:13.5px;font-weight:600;animation:fin .35s var(--ease);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.fd .fi{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.07);flex:none}
.fd .fi .ico{width:16px;height:16px}
.fd.good .fi{background:rgba(63,210,139,.18);color:#6be3a1} .fd.bad .fi{background:rgba(255,93,108,.18);color:#ff8a95} .fd.gold .fi{background:rgba(255,207,90,.18);color:#ffcf5a}
.fd.out{animation:fout .4s ease forwards}
@keyframes fin{from{transform:translateX(-16px);opacity:0}} @keyframes fout{to{transform:translateX(-16px);opacity:0}}
#big{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);font-family:var(--font-display);font-size:54px;font-weight:700;letter-spacing:2px;color:#fff;pointer-events:none;z-index:4;
  text-shadow:0 4px 0 #3a1c06,0 0 40px rgba(255,160,60,.6);opacity:0;white-space:nowrap}
#big.on{animation:big 1.8s var(--ease) forwards}
@keyframes big{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
#tip{position:absolute;pointer-events:none;z-index:6;background:rgba(18,13,9,.94);border:1px solid rgba(255,220,180,.16);border-radius:10px;padding:7px 11px;font-size:12.5px;font-weight:600;display:none;max-width:300px;box-shadow:0 8px 24px rgba(0,0,0,.5);line-height:1.45}
#tip b{color:#ffcf5a}
#tut{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:4;width:min(620px,92%);display:none;gap:14px;align-items:center;padding:14px 18px;border-radius:16px;
  background:linear-gradient(180deg,rgba(46,33,64,.96),rgba(30,22,44,.96));border:1px solid rgba(181,150,255,.4);box-shadow:0 14px 40px rgba(0,0,0,.55)}
#tut.on{display:flex;animation:fin .35s var(--ease)}
#tut .step{font-family:var(--font-display);font-size:13px;font-weight:700;color:#b9a4ff;white-space:nowrap}
#tut .tx{flex:1;font-size:14px;line-height:1.5}
#tut .tx b{color:#ffcf5a}
#wait{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:3;padding:8px 16px;border-radius:999px;background:rgba(255,176,74,.15);border:1px solid rgba(255,176,74,.4);color:#ffd9a8;font-size:13px;font-weight:700;display:none}
#wait.on{display:block}
/* ---------- Kampagnenkarte ---------- */
#menu{position:fixed;inset:0;z-index:800;display:none;background:#0c0806}
#menu.on{display:flex}
#menu .mapw{position:relative;flex:1;min-width:0;background:radial-gradient(circle at 45% 55%,#c47a40,#6a3416 80%)}
#menu svg.map{position:absolute;inset:0;width:100%;height:100%}
#menu .side{width:400px;flex:none;padding:28px;background:linear-gradient(180deg,#1b130d,#120d09);border-left:1px solid rgba(255,220,180,.1);display:flex;flex-direction:column;gap:14px;overflow:auto}
#menu .logo{font-family:var(--font-display);font-size:52px;font-weight:700;letter-spacing:4px;line-height:1;background:linear-gradient(180deg,#ffe7a8,#ff9a3a 60%,#b24a10);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #2a1405)}
#menu .sub{color:#b49b80;margin-top:-6px}
#menu .card{padding:18px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid rgba(255,220,180,.1)}
#menu .card h3{margin:0;font-family:var(--font-display);font-size:24px;font-weight:600}
#menu .card p{margin:8px 0 0;color:#c9b39b;line-height:1.5;font-size:14px}
#menu .facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
#menu .facts div{padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.25)}
#menu .facts small{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#a48a70;font-weight:700}
#menu .facts b{font-family:var(--font-display);font-size:16px;font-weight:600}
#menu .stars{color:#ffcf5a;font-size:20px;letter-spacing:3px}
#menu .stars .off{color:#4a3a2a}
#menu .btns{display:flex;flex-direction:column;gap:8px}
#menu .btns .h-btn{justify-content:flex-start}
#menu .kasse{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:12px;background:rgba(255,207,90,.08);border:1px solid rgba(255,207,90,.2)}
#menu .kasse b{font-family:var(--font-display);font-size:22px;color:#ffcf5a}
.node{cursor:pointer}
.node:hover .nr{filter:brightness(1.25)}
.h-btn.oil{background:linear-gradient(180deg,#ffc56a,#f08a1c);color:#2a1400;border-color:transparent;box-shadow:0 6px 22px rgba(240,138,28,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.h-btn.oil:hover{filter:brightness(1.07)}
/* ---------- Saloon & Dialoge ---------- */
.ups{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:16px 0 4px;text-align:left}
.upg{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,220,180,.1)}
.upg .ui{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#4a3220,#2a1c12);display:flex;align-items:center;justify-content:center;color:#ffcf9a;flex:none}
.upg .ui .ico{width:22px;height:22px}
.upg .ut{flex:1;min-width:0}
.upg .ut b{display:block;font-size:14px}
.upg .ut small{display:block;color:#b49b80;font-size:12px;line-height:1.35}
.pips{display:flex;gap:3px;margin-top:5px}
.pips i{width:14px;height:5px;border-radius:3px;background:rgba(0,0,0,.45)}
.pips i.on{background:#ffb04a}
.res{display:grid;grid-template-columns:1fr auto;gap:8px 18px;margin:14px 0;text-align:left}
.res span:nth-child(even){text-align:right;font-family:var(--font-display);font-weight:600;font-variant-numeric:tabular-nums}
.bigstars{display:flex;gap:10px;justify-content:center;margin:8px 0 4px}
.bigstars svg{width:56px;height:56px}
.bigstars .s{animation:spop .5s var(--ease) both}
@keyframes spop{from{transform:scale(0) rotate(-40deg);opacity:0}}
.rank{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.rank div{display:flex;justify-content:space-between;padding:8px 12px;border-radius:10px;background:rgba(0,0,0,.25);border-left:4px solid;font-size:14px}
.auc{font-family:var(--font-display);font-size:44px;font-weight:700;color:#ffcf5a;margin:6px 0;font-variant-numeric:tabular-nums}
.howto li{margin-bottom:8px;line-height:1.5;color:#d9c8b5}
.howto b{color:#fff}
@media (max-width:1100px){ #menu .side{width:330px} .hc.wide{min-width:150px} #mini{width:170px} }
</style>
</head>
<body>
<div id="hud">
  <div class="seg"><button id="menuBtn" title="Kampagnenkarte"><span data-i="list"></span>Karte</button><button id="saloonBtn" title="Saloon – Upgrades"><span data-i="coins"></span>Saloon</button></div>
  <div class="hc"><small id="townLbl">Stadt</small><b id="townName">–</b></div>
  <div class="hc wide"><small id="monthTxt">Januar</small><div class="pr"><i id="yearBar"></i></div></div>
  <div class="hc money"><small>Kasse</small><b id="moneyTxt">0 €</b></div>
  <div class="hc wide"><small>Jahresziel <span id="starsTxt"></span></small><div class="pr goal"><i id="goalBar"></i><span class="mk" style="left:50%"></span><span class="mk" style="left:75%"></span></div><small id="goalTxt" style="margin-top:4px;text-transform:none;letter-spacing:0"></small></div>
  <div class="hc price" id="pL"><div><small>Raffinerie West</small><b id="pLv">–</b> <span class="tr" id="pLt"></span></div><canvas id="pLs" width="168" height="60"></canvas></div>
  <div class="hc price" id="pR"><div><small>Raffinerie Ost</small><b id="pRv">–</b> <span class="tr" id="pRt"></span></div><canvas id="pRs" width="168" height="60"></canvas></div>
  <div class="seg" id="sellSeg" title="Wohin deine Wagen verkaufen"><span class="lbl">Verkauf</span><button data-s="auto" class="on">Auto</button><button data-s="L">West</button><button data-s="R">Ost</button></div>
  <div class="seg" id="speedSeg"><button data-v="0" title="Pause (Leertaste)"><span data-i="pause"></span></button><button data-v="1" class="on" title="Normal (1)">1×</button><button data-v="2" title="Schnell (2)">2×</button><button data-v="3" title="Sehr schnell (3)">3×</button></div>
</div>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="feed"></div><div id="big"></div><div id="tip"></div><div id="tut"></div>
  <div id="wait">Das Jahr beginnt, sobald du deinen ersten Bohrturm baust.</div>
</div>
<div id="dock">
  <canvas id="mini" width="540" height="132" title="Übersichtskarte – klicken zum Hinspringen"></canvas>
  <div class="tools" id="tools">
    <button class="tool" data-tool="rig"><kbd>B</kbd><svg viewBox="0 0 32 32"><g stroke="#ffd9a8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10 29 15 6h2l5 23"/><path d="M11.5 22l8.5-6M20.5 22 12 16M13 12.5l6-3"/><path d="M5 29h22"/></g><path d="M16 6V1.5l5.5 1.6L16 4.7" fill="#ff8a3d"/></svg><b>Bohrturm</b><small data-c="rig"></small></button>
    <button class="tool" data-tool="wagon"><kbd>W</kbd><svg viewBox="0 0 32 32"><g stroke="#ffd9a8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="18" height="9" rx="1.5"/><circle cx="9" cy="23" r="3.5"/><circle cx="18" cy="23" r="3.5"/><path d="M22 15h6"/></g><rect x="8" y="5.5" width="10" height="6" rx="2" fill="#ff8a3d"/></svg><b>Pferdewagen</b><small data-c="wagon"></small></button>
    <button class="tool" data-tool="dowser"><kbd>R</kbd><svg viewBox="0 0 32 32"><g stroke="#ffd9a8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6" r="3"/><path d="M12 9v10l-4 9M12 19l4 9M12 13l7 3"/><path d="M19 16l7-6M19 16l8 1"/></g><path d="M6 5h12" stroke="#ff8a3d" stroke-width="2.4" stroke-linecap="round"/></svg><b>Rutengänger</b><small data-c="dowser"></small></button>
    <button class="tool" data-tool="scan"><kbd>E</kbd><svg viewBox="0 0 32 32"><g stroke="#ffd9a8" stroke-width="2" fill="none" stroke-linecap="round"><path d="M16 26a10 10 0 0 0 10-10"/><path d="M16 21a5 5 0 0 0 5-5"/><path d="M6 16a10 10 0 0 1 10-10" opacity=".45"/></g><circle cx="16" cy="16" r="2.6" fill="#ff8a3d"/></svg><b>Echolot</b><small data-c="scan"></small></button>
    <button class="tool" data-tool="mole"><kbd>M</kbd><svg viewBox="0 0 32 32"><ellipse cx="15" cy="18" rx="10" ry="7" fill="none" stroke="#ffd9a8" stroke-width="2"/><circle cx="25.5" cy="17" r="2.2" fill="#ff8a3d"/><circle cx="19" cy="15.5" r="1.2" fill="#ffd9a8"/><path d="M8 25l-2 3M13 25l-1 3M19 25l1 3" stroke="#ffd9a8" stroke-width="2" stroke-linecap="round"/></svg><b>Maulwurf</b><small data-c="mole"></small></button>
  </div>
  <div id="sel"></div>
</div>

<div id="menu">
  <div class="mapw"><svg class="map" id="map" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"></svg></div>
  <div class="side">
    <div><div class="logo">ÖLRAUSCH</div><div class="sub">Bohren · Pumpen · Reich werden</div></div>
    <div class="kasse"><span>Firmenkasse</span><b id="mKasse">0 €</b></div>
    <div class="card" id="brief"></div>
    <div class="btns">
      <button class="h-btn oil lg" id="mPlay"></button>
      <button class="h-btn lg" id="mSaloon"><span data-i="coins"></span>Saloon – Upgrades kaufen</button>
      <button class="h-btn lg" id="mHow"><span data-i="help"></span>So wird gespielt</button>
      <a class="h-btn lg ghost" href="../Launcher.html"><span data-i="left"></span>Zurück zur Spielhalle</a>
    </div>
  </div>
</div>

<script src="shared/hub.js"></script>
<script src="shared/catalog.js"></script>
<script src="oelrausch.js"></script>
</body>
</html>
