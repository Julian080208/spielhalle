<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTube-Kino</title>
<link rel="stylesheet" href="shared/hub.css">
<style>
html,body{height:100%;margin:0;overflow:hidden;background:#0b0c10}
body{display:flex;flex-direction:column}
#top{display:flex;gap:10px;align-items:center;padding:14px 16px;flex-wrap:wrap}
.sb{flex:1;min-width:260px;display:flex;align-items:center;gap:10px;height:54px;padding:0 16px;border-radius:999px;background:#181a22;border:2px solid #2a2d38}
.sb:focus-within{border-color:#ff3b3b}
.sb span{font-size:20px;font-family:'Segoe UI Emoji'}
.sb input{flex:1;border:0;outline:0;background:none;color:#fff;font:inherit;font-size:18px;min-width:0}
.btnr{height:54px;padding:0 22px;border-radius:999px;border:0;background:linear-gradient(180deg,#ff3b3b,#cc0000);color:#fff;font:inherit;font-weight:800;font-size:16px;cursor:pointer}
#chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 10px}
#chips button{height:34px;padding:0 14px;border-radius:999px;border:1px solid #2a2d38;background:#181a22;color:#ddd;font:inherit;font-weight:700;cursor:pointer}
#chips button:hover{border-color:#ff3b3b;color:#fff}
#main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 360px;gap:14px;padding:0 16px 16px}
#main.noplayer{grid-template-columns:1fr}
#left{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px}
#playerWrap{flex:none;position:relative;width:100%;aspect-ratio:16/9;max-height:62vh;margin:0 auto;background:#000;border-radius:16px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5);display:none}
#main:not(.noplayer) #playerWrap{display:block}
#player{position:absolute;inset:0;width:100%;height:100%;border:0}
#nowTitle{font-family:var(--font-display);font-size:20px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#nowTitle .h-btn{margin-left:auto}
#results{flex:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.vid{cursor:pointer;border-radius:14px;overflow:hidden;background:#14161d;transition:transform .15s,box-shadow .15s;position:relative}
.vid:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.5)}
.vid .th{position:relative;aspect-ratio:16/9;background:#222 center/cover}
.vid .th i{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;font-style:normal;font-size:12px;font-weight:700;padding:2px 6px;border-radius:6px}
.vid .bd{padding:10px 12px 12px}
.vid b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14.5px;line-height:1.3}
.vid small{display:block;color:#9aa0ad;font-size:12px;margin-top:4px}
.vid .add{position:absolute;top:8px;right:8px;height:30px;padding:0 10px;border-radius:999px;border:0;background:rgba(0,0,0,.75);color:#fff;font-weight:800;font-size:12px;cursor:pointer;opacity:0;transition:.15s}
.vid:hover .add{opacity:1}
#side{min-height:0;display:flex;flex-direction:column;gap:10px;background:#14161d;border-radius:16px;padding:12px}
#side h3{margin:0;font-size:12px;letter-spacing:1.5px;color:#9aa0ad;display:flex;justify-content:space-between;align-items:center}
#queue{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px}
.q{display:flex;gap:10px;align-items:center;padding:6px;border-radius:10px;background:#1b1e27;cursor:pointer}
.q.now{outline:2px solid #ff3b3b}
.q img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;flex:none}
.q b{font-size:12.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.q button{margin-left:auto;background:none;border:0;color:#888;cursor:pointer;font-size:15px}
#empty{color:#9aa0ad;text-align:center;padding:40px 10px;font-size:16px}
.spin{width:40px;height:40px;border-radius:50%;border:4px solid #333;border-top-color:#ff3b3b;animation:sp 1s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
html.tv #top,html.tv #chips,html.tv #side{zoom:1.2}
html.tv .vid b{font-size:17px}
@media (max-width:900px){#main{grid-template-columns:1fr}#side{max-height:240px}}
</style>
</head>
<body>
<div id="top"><div class="sb"><span>🔎</span><input id="q" placeholder="YouTube durchsuchen – oder Link einfügen …" autocomplete="off"></div><button class="btnr" id="go">Suchen</button></div>
<div id="chips"></div>
<div id="main" class="noplayer">
  <div id="left">
    <div id="playerWrap"><div id="player"></div></div>
    <div id="nowTitle"></div>
    <div id="results"><div id="empty">▶ Suche oben nach Videos, Musik oder Karaoke – alles läuft direkt hier in der Spielhalle.</div></div>
  </div>
  <div id="side"><h3>WARTESCHLANGE <button class="h-btn sm ghost" id="clearQ">Leeren</button></h3><div id="queue"></div><small style="color:#9aa0ad">Tipp: „+ Warteschlange“ bei einem Video – dann läuft alles nacheinander, perfekt für Partymusik.</small></div>
</div>
<script src="shared/hub.js"></script>
<script>
const $ = id => document.getElementById(id);
const IDEAS = ['🎉 Partymusik', '🎤 Karaoke Songs', '😂 Lustige Videos', '🧠 Quiz für Gruppen', '🎮 Gaming Highlights', '🎧 Lofi zum Zocken', '🕺 Just Dance', '⚽ Fußball Highlights', '🍕 Pizza Rezept', '🎬 Filmtrailer 2026'];
let queue = Hub.read('kino_queue', []), nowIdx = -1, player = null, apiReady = false, pendingId = null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'})[c]);
const thumb = id => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
$('chips').innerHTML = IDEAS.map(t => `<button data-q="${t.slice(3)}">${t}</button>`).join('');
$('chips').onclick = e => { const q = e.target.dataset.q; if (q){ $('q').value = q; search(q); } };

// YouTube-IFrame-API laden
const tag = document.createElement('script'); tag.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(tag);
window.onYouTubeIframeAPIReady = () => { apiReady = true; if (pendingId) play(pendingId); };

function findVideos(obj, out){
  if (!obj || typeof obj !== 'object') return out;
  if (obj.videoRenderer && obj.videoRenderer.videoId){
    const v = obj.videoRenderer, txt = x => x ? (x.simpleText || (x.runs || []).map(r => r.text).join('')) : '';
    out.push({id:v.videoId, title:txt(v.title), ch:txt(v.ownerText || v.longBylineText), len:txt(v.lengthText), views:txt(v.shortViewCountText || v.viewCountText)});
    return out;
  }
  for (const k in obj) findVideos(obj[k], out);
  return out;
}
const idFromLink = s => { const m = s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : (/^[\w-]{11}$/.test(s.trim()) ? s.trim() : null); };
async function search(q){
  q = q.trim(); if (!q) return;
  const lid = idFromLink(q); if (lid) return play(lid, 'Video aus Link');
  $('results').innerHTML = '<div class="spin"></div>';
  try {
    const r = await fetch('/__yt?q=' + encodeURIComponent(q));
    const data = await r.json();
    const vids = findVideos(data, []).slice(0, 40);
    if (!vids.length) throw 0;
    $('results').innerHTML = vids.map(v => `<div class="vid" data-id="${v.id}" data-t="${esc(v.title)}"><div class="th" style="background-image:url(${thumb(v.id)})">${v.len ? `<i>${esc(v.len)}</i>` : ''}</div><button class="add" data-add="1">+ Warteschlange</button><div class="bd"><b>${esc(v.title)}</b><small>${esc(v.ch)}${v.views ? ' · ' + esc(v.views) : ''}</small></div></div>`).join('');
  } catch(e){
    $('results').innerHTML = `<div id="empty">😕 Die Suche hat gerade nicht geklappt (Internet da?). Du kannst auch einen YouTube-Link oben einfügen.</div>`;
  }
}
$('results').onclick = e => {
  const v = e.target.closest('.vid'); if (!v) return;
  if (e.target.dataset.add){ addQueue(v.dataset.id, v.dataset.t); return; }
  play(v.dataset.id, v.dataset.t);
};
function play(id, title){
  $('main').classList.remove('noplayer');
  if (!apiReady){ pendingId = id; return; }
  pendingId = null;
  if (!queue.some(q => q.id === id)){ queue.splice(nowIdx + 1, 0, {id, t:title || 'Video'}); }
  nowIdx = queue.findIndex(q => q.id === id); saveQ();
  $('nowTitle').innerHTML = `▶ ${esc(queue[nowIdx].t)} <button class="h-btn sm" id="fs">⛶ Vollbild</button><button class="h-btn sm" id="nx">⏭ Nächstes</button>`;
  $('fs').onclick = () => { const w = $('playerWrap'); (document.fullscreenElement ? document.exitFullscreen() : w.requestFullscreen()).catch(() => {}); };
  $('nx').onclick = next;
  if (!player) player = new YT.Player('player', {videoId:id, playerVars:{autoplay:1, rel:0, playsinline:1, modestbranding:1}, events:{onStateChange:e => { if (e.data === 0) next(); }}});
  else player.loadVideoById(id);
  renderQ(); $('left').scrollTop = 0;
}
function next(){ if (nowIdx + 1 < queue.length) play(queue[nowIdx + 1].id, queue[nowIdx + 1].t); }
function addQueue(id, t){ if (queue.some(q => q.id === id)) return Hub.toast('Schon in der Warteschlange', '', 'list'); queue.push({id, t}); saveQ(); renderQ(); Hub.toast('Zur Warteschlange hinzugefügt', t, 'list'); if (nowIdx < 0) play(id, t); }
function saveQ(){ Hub.write('kino_queue', queue.slice(-60)); }
function renderQ(){
  $('queue').innerHTML = queue.length ? queue.map((q, k) => `<div class="q ${k === nowIdx ? 'now' : ''}" data-k="${k}"><img src="${thumb(q.id)}" alt=""><b>${esc(q.t)}</b><button data-del="${k}" title="Entfernen">✕</button></div>`).join('') : '<small style="color:#777">Noch leer.</small>';
}
$('queue').onclick = e => {
  if (e.target.dataset.del != null){ const k = +e.target.dataset.del; queue.splice(k, 1); if (k < nowIdx) nowIdx--; else if (k === nowIdx) nowIdx = -1; saveQ(); renderQ(); return; }
  const q = e.target.closest('.q'); if (q){ const it = queue[+q.dataset.k]; play(it.id, it.t); }
};
$('clearQ').onclick = () => { queue = queue.filter((q, k) => k === nowIdx); nowIdx = queue.length ? 0 : -1; saveQ(); renderQ(); };
$('go').onclick = () => search($('q').value);
$('q').onkeydown = e => { if (e.key === 'Enter') search(e.target.value); };
addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== $('q')){ e.preventDefault(); $('q').focus(); } });
renderQ();
const P = new URLSearchParams(location.search), start = P.get('q');
if (P.get('tv') === '1') document.documentElement.classList.add('tv');
if (start){ $('q').value = start; search(start); }
</script>
</body>
</html>
