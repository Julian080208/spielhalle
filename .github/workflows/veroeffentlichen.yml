# Baut die Spielhalle auf einem Windows-Rechner von GitHub und legt das Release an,
# sobald auf main eine neue Version in installer/version.txt ankommt
# (Neuigkeiten aus installer/neu.txt). Gibt es das Release schon – etwa weil
# veroeffentlichen.ps1 es angelegt hat – passiert nichts.
name: Veröffentlichen
on:
  push:
    branches: [main]
    paths: [installer/version.txt]
  workflow_dispatch:
permissions:
  contents: write
concurrency: veroeffentlichen
jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Bauen
        shell: powershell
        run: .\installer\build.ps1
      - name: Release anlegen
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'   # gh schreibt "release not found" nach stderr
          $v = ([IO.File]::ReadAllText("installer\version.txt")).Trim()
          gh release view "v$v" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { "Spielhalle $v ist schon veröffentlicht"; exit 0 }
          gh release create "v$v" installer\dist\Spielhalle-Setup.exe installer\dist\version.json --target "$env:GITHUB_SHA" --title "Spielhalle $v" --notes-file installer\neu.txt
          if ($LASTEXITCODE) { throw 'GitHub-Release fehlgeschlagen' }
          "Veröffentlicht: Spielhalle $v"
