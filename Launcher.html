<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spielhalle</title>
<!--
  Der Launcher der Spielhalle. Die App (app/Spielhalle.cs) holt diese Datei und den Ordner
  spiele/ direkt von GitHub und liefert unter /__spiele alle Spiele (jede HTML-Datei in spiele/).
  Cover, Text und Kategorie kommen aus spiele/shared/catalog*.js oder – bei neuen Spielen –
  aus den <meta name="spielhalle-…">-Angaben im Spiel selbst.
-->
<style>
  :root { --bg:#0c0d14; --panel:#151724; --line:#262a3d; --text:#f2f3fa; --muted:#9499b3; --accent:#7c6cff; --accent-2:#c45cff; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI', system-ui, sans-serif; }
  body { overflow-y:auto; background:radial-gradient(1200px 600px at 10% -10%, rgba(124,108,255,.18), transparent 60%),
         radial-gradient(900px 500px at 100% 0%, rgba(255,90,140,.10), transparent 60%), var(--bg); background-attachment:fixed; }
  button { font:inherit; color:inherit; cursor:pointer; }
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:16px; padding:18px 32px;
           background:linear-gradient(var(--bg) 70%, transparent); }
  .logo { display:flex; align-items:center; gap:12px; font-size:26px; font-weight:800; letter-spacing:.5px; white-space:nowrap; }
  .logo i { width:46px; height:46px; border-radius:14px; display:grid; place-items:center; font-style:normal; font-size:22px;
            background:linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow:0 6px 20px rgba(124,108,255,.45); }
  .search { flex:1; max-width:560px; display:flex; align-items:center; gap:10px; height:50px; padding:0 18px; border-radius:999px;
            background:var(--panel); border:1px solid var(--line); }
  .search:focus-within { border-color:var(--accent); }
  .search input { flex:1; min-width:0; background:none; border:0; outline:0; color:var(--text); font:inherit; font-size:17px; }
  .btn { height:50px; padding:0 20px; border-radius:999px; border:1px solid var(--line); background:var(--panel); font-weight:700; font-size:15px;
         display:inline-flex; align-items:center; gap:8px; white-space:nowrap; }
  .btn:hover, .btn:focus-visible { border-color:var(--accent); outline:0; }
  .btn.primary { background:linear-gradient(135deg, var(--accent), var(--accent-2)); border:0; }
  .btn.sm { height:38px; padding:0 14px; font-size:14px; }
  .clock { margin-left:auto; text-align:right; font-weight:800; font-size:24px; white-space:nowrap; }
  .clock small { display:block; font-size:13px; font-weight:500; color:var(--muted); }
  main { padding:0 32px 40px; }
  .banners { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:10; display:flex; flex-direction:column; gap:10px; width:min(860px, calc(100vw - 32px)); }
  .banner { display:none; align-items:center; gap:14px; padding:14px 18px; border-radius:16px; font-size:16px;
            background:#262145; border:1px solid rgba(124,108,255,.7); box-shadow:0 12px 40px rgba(0,0,0,.6); }
  .banner.on { display:flex; }
  .banner b { font-size:18px; white-space:nowrap; }
  .banner .btn { margin-left:auto; }
  h2 { margin:26px 0 12px; font-size:20px; }
  .players { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .player { display:inline-flex; align-items:center; gap:8px; height:44px; padding:0 16px 0 6px; border-radius:999px; border:2px solid var(--pc);
            background:color-mix(in srgb, var(--pc) 22%, var(--panel)); font-weight:700; font-size:16px; }
  .player span { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; background:var(--pc); font-size:18px; }
  .player.off { border-color:var(--line); background:var(--panel); color:var(--muted); text-decoration:line-through; }
  .player.off span { background:var(--line); filter:grayscale(1); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:22px 0 4px; }
  .chip { height:38px; padding:0 16px; border-radius:999px; border:1px solid var(--line); background:var(--panel); font-weight:600; color:var(--muted); }
  .chip.on { background:var(--text); color:var(--bg); border-color:var(--text); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(270px, 1fr)); gap:18px; margin-top:16px; }
  .tile { position:relative; border-radius:18px; overflow:hidden; background:var(--panel); border:1px solid var(--line); text-align:left; padding:0;
          transition:transform .15s, box-shadow .15s, border-color .15s; }
  .tile:hover, .tile:focus-visible { transform:translateY(-4px) scale(1.02); border-color:var(--glow, var(--accent)); outline:0;
          box-shadow:0 14px 34px rgba(0,0,0,.5), 0 0 0 3px color-mix(in srgb, var(--glow, var(--accent)) 60%, transparent); }
  .cv { aspect-ratio:16/9; position:relative; overflow:hidden; background:#000; }
  .cv svg { width:100%; height:100%; display:block; }
  .cv .new { position:absolute; left:10px; top:10px; padding:3px 10px; border-radius:999px; background:#ff4f7a; font-size:12px; font-weight:800; letter-spacing:.5px; }
  .cv .play { position:absolute; inset:0; display:grid; place-items:center; background:rgba(0,0,0,.35); opacity:0; transition:opacity .15s; font-size:46px; }
  .tile:hover .play, .tile:focus-visible .play { opacity:1; }
  .bd { padding:12px 14px 14px; }
  .bd b { display:block; font-size:18px; }
  .bd small { display:block; color:var(--muted); font-size:14px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .empty { grid-column:1/-1; padding:40px; text-align:center; color:var(--muted); font-size:18px; }
  footer { display:flex; flex-wrap:wrap; align-items:center; gap:14px; margin-top:34px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:14px; }
  footer .hint { color:#ff9aa8; }
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:20px; padding:24px; width:min(560px, 92vw); }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog h3 { margin:0 0 16px; font-size:22px; }
  .prow { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .prow input[type=text] { flex:1; height:44px; padding:0 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; font-size:16px; }
  .prow .av { width:44px; height:44px; border-radius:50%; border:0; font-size:22px; background:var(--pc); }
  .prow .col { width:30px; height:30px; border-radius:50%; border:2px solid #fff3; background:var(--pc); }
  .drow { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
  /* Einstellungen */
  html.tv body { zoom:var(--tvz, 1.3); }
  #set { width:min(820px, 94vw); max-height:88vh; padding:0; }
  #set .top { position:sticky; top:0; z-index:1; display:flex; align-items:center; gap:12px; padding:20px 24px; background:var(--panel); border-bottom:1px solid var(--line); }
  #set .top h3 { margin:0; flex:1; }
  #set .body { padding:6px 24px 24px; }
  #set h4 { margin:22px 0 6px; font-size:13px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); }
  .srow { display:flex; align-items:center; gap:16px; padding:12px 0; border-bottom:1px solid var(--line); }
  .srow:last-child { border-bottom:0; }
  .srow label { flex:1; font-weight:600; font-size:16px; }
  .srow label small { display:block; font-weight:400; font-size:13px; color:var(--muted); margin-top:2px; }
  .srow input[type=text] { width:240px; height:42px; padding:0 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; font-size:16px; }
  .srow input[type=range] { width:220px; accent-color:var(--accent); }
  .srow .val { width:60px; white-space:nowrap; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
  .sw { width:30px; height:30px; border-radius:50%; border:3px solid transparent; padding:0; }
  .sw.on { border-color:var(--text); }
  .tog { width:54px; height:30px; border-radius:999px; border:0; background:var(--line); position:relative; flex:none; transition:background .15s; }
  .tog::after { content:''; position:absolute; left:4px; top:4px; width:22px; height:22px; border-radius:50%; background:#fff; transition:left .15s; }
  .tog.on { background:var(--accent); }
  .tog.on::after { left:28px; }
  .seg { display:flex; gap:4px; padding:4px; border-radius:999px; background:var(--bg); border:1px solid var(--line); }
  .seg button { height:32px; padding:0 12px; border-radius:999px; border:0; background:none; color:var(--muted); font-weight:600; font-size:13px; }
  .seg button.on { background:var(--text); color:var(--bg); }
  .btn.danger { color:#ff8a95; border-color:#5a2630; }
  @media (max-width:760px) { .srow { flex-wrap:wrap; } .srow input[type=text], .srow input[type=range] { width:100%; } }
  @media (max-width:760px) { .banner span { display:none; } header { flex-wrap:wrap; padding:14px 16px; } .clock { display:none; } main { padding:0 16px 30px; } }
</style>
</head>
<body id="spielhalle-launcher">
<header>
  <div class="logo"><i>▶</i>Spielhalle</div>
  <label class="search"><span>🔍</span><input id="q" type="search" placeholder="Spiel suchen …" autocomplete="off"></label>
  <button class="btn" id="zufall" title="Ein zufälliges Spiel starten">🎲 Zufall</button>
  <button class="btn" id="voll" title="Vollbild (F11)">⛶</button>
  <button class="btn" id="setBtn" title="Einstellungen">⚙️ Einstellungen</button>
  <div class="clock"><span id="uhr"></span><small id="datum"></small></div>
</header>
<main>
  <div class="banners">
  <div class="banner" id="bNeu"><b>🎉 Neue Spiele sind da!</b><span>Die Spielhalle hat gerade neue Spiele oder Verbesserungen geladen.</span><button class="btn primary sm" id="neuLaden">Anzeigen</button></div>
  <div class="banner" id="bApp"><b>🚀 Neue App-Version</b><span id="bAppText"></span><button class="btn primary sm" id="neuStart">Jetzt neu starten</button></div>
  </div>

  <h2>Wer spielt mit?</h2>
  <div class="players" id="players"></div>

  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>

  <footer>
    <span id="fVersion">Spielhalle</span>
    <span id="fStand"></span>
    <button class="btn sm" id="suchen">🔄 Nach neuen Spielen suchen</button>
    <span class="hint" id="fHinweis"></span>
  </footer>
</main>

<dialog id="set">
  <div class="top"><h3>⚙️ Einstellungen</h3><button class="btn sm primary" id="setOk">Fertig</button></div>
  <div class="body">
    <h4>Profil</h4>
    <div class="srow"><label>Dein Name<small>Wird in den Spielen angezeigt</small></label><input type="text" id="sName" maxlength="20"></div>
    <div class="srow"><label>Farbe<small>Für Knöpfe und Leuchteffekte</small></label><div id="sFarben" style="display:flex;gap:8px"></div></div>

    <h4>Ton</h4>
    <div class="srow"><label>Gesamtlautstärke</label><input type="range" id="sMaster" min="0" max="100"><span class="val" id="vMaster"></span></div>
    <div class="srow"><label>Effekte</label><input type="range" id="sSfx" min="0" max="100"><span class="val" id="vSfx"></span></div>
    <div class="srow"><label>Musik</label><input type="range" id="sMusic" min="0" max="100"><span class="val" id="vMusic"></span></div>

    <h4>Anzeige</h4>
    <div class="srow"><label>Fernseher-Modus<small>Größere Schrift und Knöpfe, damit man vom Sofa aus alles lesen kann</small></label>
      <div class="seg" id="sTvGroesse"></div><button class="tog" id="sTv"></button></div>
    <div class="srow"><label>Bewegungen reduzieren<small>Weniger Animationen in den Spielen</small></label><button class="tog" id="sRuhig"></button></div>

    <div id="sAppTeil" hidden>
      <h4>App</h4>
      <div class="srow"><label>Beim Start im Vollbild<small>Die Spielhalle füllt gleich den ganzen Bildschirm (F11 schaltet um)</small></label><button class="tog" id="sVollbild"></button></div>
      <div class="srow"><label>Mit Windows starten<small>Die Spielhalle geht automatisch auf, wenn der PC hochfährt</small></label><button class="tog" id="sAutostart"></button></div>
    </div>

    <div id="sUpdTeil" hidden>
      <h4>Updates</h4>
      <div class="srow"><label>Spielhalle-Version<small id="sVersion"></small></label></div>
      <div class="srow"><label>Spiele<small id="sStand"></small></label><button class="btn sm" id="sSuchen">🔄 Nach neuen Spielen suchen</button></div>
    </div>

    <h4>Spielstände</h4>
    <div class="srow"><label>Sichern<small>Alle Spielstände, Rekorde, Chips und Einstellungen in eine Datei speichern</small></label><button class="btn sm" id="sExport">⬇️ Sichern</button></div>
    <div class="srow"><label>Wiederherstellen<small>Eine gesicherte Datei laden (überschreibt den jetzigen Stand)</small></label><button class="btn sm" id="sImport">⬆️ Laden</button><input type="file" id="sImportFile" accept=".json" hidden></div>
    <div class="srow"><label>Alles zurücksetzen<small>Löscht alle Spielstände – endgültig</small></label><button class="btn sm danger" id="sReset">🗑️ Löschen</button></div>
  </div>
</dialog>

<dialog id="dlg">
  <h3>Wer spielt mit?</h3>
  <div id="dlgRows"></div>
  <div class="drow"><button class="btn sm" id="dlgAdd">+ Person</button><span style="flex:1"></span><button class="btn sm primary" id="dlgOk">Fertig</button></div>
</dialog>

<script src="spiele/shared/hub.js"></script>
<script src="spiele/shared/catalog.js"></script>
<script src="spiele/shared/catalog2.js"></script>
<script src="spiele/shared/catalog3.js"></script>
<script src="spiele/shared/catalog4.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'})[c]);
const APP = location.port === '8777';
const CATALOG = window.HubCatalog || [];
const LAST_KEY = 'spielhalle_zuletzt';
const read = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch(e){ return d; } };
const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };

// ---------------------------------------------------------------- Spiele
const COLORS = ['#7c6cff', '#ff8a3d', '#2fbf71', '#ff4f9a', '#3d8bff', '#c45cff', '#18c5d8', '#ffb020'];
function makeCover(title, sym, color){
  const fs = Math.max(26, Math.min(52, Math.round(1000 / Math.max(10, title.length)))), u = 'g' + Math.random().toString(36).slice(2, 8);
  return `<svg viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="${u}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${color}"/><stop offset="1" stop-color="#0d0f16"/></linearGradient>
      <radialGradient id="${u}r"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
    <rect width="640" height="360" fill="url(#${u})"/><circle cx="470" cy="150" r="170" fill="url(#${u}r)"/>
    <text x="470" y="150" font-size="150" text-anchor="middle" dominant-baseline="central">${esc(sym)}</text>
    <text x="40" y="318" font-size="${fs}" font-weight="800" fill="#fff" font-family="Segoe UI,system-ui,sans-serif">${esc(title)}</text></svg>`;
}
// Ein Spiel aus der Dateiliste der App; Angaben aus dem Katalog haben Vorrang
function toGame(s){
  const m = s.meta || {}, cat = CATALOG.find(c => c.file === s.file);
  const name = s.file.replace(/^spiele\//, '').replace(/\.html$/i, '');
  const hash = [...name].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  const color = /^#[0-9a-f]{3,8}$/i.test(m.farbe || '') ? m.farbe : (cat && cat.accent) || COLORS[hash % COLORS.length];
  const title = (cat && cat.title) || m.titel || (s.title || name).replace(/\s+[–|-]\s+Spielhalle$/i, '');
  const genres = cat ? cat.genres : (m.genre || '').split(',').map(t => t.trim()).filter(Boolean);
  return {file:s.file, id:cat ? cat.id : 'datei_' + name, title, color,
    tagline:(cat && cat.tagline) || m.beschreibung || '', desc:(cat && cat.desc) || m.text || m.beschreibung || '',
    genres:genres.length ? genres : ['Neu'], catNew:!!(cat && cat.isNew), noCat:!cat,
    cover:() => { try { if (cat && cat.cover) return cat.cover(); } catch(e){} return makeCover(title, [...(m.symbol || '🎮')].slice(0, 4).join(''), color); }};
}
let GAMES = [];
const coverCache = {};
const cover = g => coverCache[g.file] || (coverCache[g.file] = g.cover());
function lastPlayed(g){
  const own = read(LAST_KEY, {})[g.file] || 0;
  const hub = window.Hub && Hub.profile.games[g.id] ? Hub.profile.games[g.id].last || 0 : 0;
  return Math.max(own, hub);
}
const isNew = g => (g.catNew || g.noCat) && !lastPlayed(g);

async function loadGames(){
  let list = null;
  if (APP) try { list = await (await fetch('/__spiele', {cache:'no-store'})).json(); } catch(e){}
  if (!list) list = CATALOG.map(c => ({file:c.file, title:c.title, meta:{}}));   // ohne App: nur der Katalog
  GAMES = list.filter(s => s && s.file).map(toGame).sort((a, b) => a.title.localeCompare(b.title, 'de'));
  renderChips(); renderGrid();
}

function launch(g){
  const l = read(LAST_KEY, {}); l[g.file] = Date.now(); write(LAST_KEY, l);
  location.href = g.file;
}

// ---------------------------------------------------------------- Raster, Filter, Suche
let filter = 'Alle', query = '';
function renderChips(){
  const genres = [...new Set(GAMES.flatMap(g => g.genres))].sort((a, b) => a.localeCompare(b, 'de'));
  const all = ['Alle', 'Zuletzt gespielt', ...genres];
  if (!all.includes(filter)) filter = 'Alle';
  $('chips').innerHTML = all.map(x => `<button class="chip ${x === filter ? 'on' : ''}" data-f="${esc(x)}">${esc(x)}</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(b => b.onclick = () => { filter = b.dataset.f; renderChips(); renderGrid(); });
}
function visible(){
  let l = GAMES.filter(g => !query || (g.title + ' ' + g.genres.join(' ') + ' ' + g.tagline).toLowerCase().includes(query));
  if (filter === 'Zuletzt gespielt') l = l.filter(lastPlayed).sort((a, b) => lastPlayed(b) - lastPlayed(a));
  else if (filter !== 'Alle') l = l.filter(g => g.genres.includes(filter));
  else l = l.slice().sort((a, b) => (isNew(b) - isNew(a)) || a.title.localeCompare(b.title, 'de'));
  return l;
}
function renderGrid(){
  const l = visible();
  $('grid').innerHTML = l.length ? l.map((g, i) => `<button class="tile" data-i="${GAMES.indexOf(g)}" style="--glow:${esc(g.color)}" title="${esc(g.desc)}">
      <div class="cv">${cover(g)}${isNew(g) ? '<span class="new">NEU</span>' : ''}<div class="play">▶</div></div>
      <div class="bd"><b>${esc(g.title)}</b><small>${esc(g.tagline || g.genres.join(' · '))}</small></div></button>`).join('')
    : `<div class="empty">${GAMES.length ? `Kein Spiel gefunden${query ? ` für „${esc(query)}“` : ''}.` : 'Spiele werden geladen …'}</div>`;
  $('grid').querySelectorAll('.tile').forEach(t => t.onclick = () => launch(GAMES[+t.dataset.i]));
}
$('q').oninput = e => { query = e.target.value.trim().toLowerCase(); renderGrid(); };
$('q').onkeydown = e => {
  if (e.key === 'Enter'){ const g = visible()[0]; if (g) launch(g); }
  if (e.key === 'Escape'){ e.target.value = ''; query = ''; renderGrid(); e.target.blur(); }
};
$('zufall').onclick = () => { const l = visible().length ? visible() : GAMES; if (l.length) launch(l[Math.floor(Math.random() * l.length)]); };
$('voll').onclick = () => window.spielhalleVollbild ? spielhalleVollbild()
  : (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}));

// Pfeiltasten wandern durch die Spiele, Enter startet
addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('q')){ e.preventDefault(); $('q').focus(); return; }
  const t = document.activeElement;
  if (!t || !t.classList.contains('tile') || !['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) return;
  const tiles = [...$('grid').querySelectorAll('.tile')], i = tiles.indexOf(t);
  const cols = getComputedStyle($('grid')).gridTemplateColumns.split(' ').length;
  const j = {ArrowLeft:i - 1, ArrowRight:i + 1, ArrowUp:i - cols, ArrowDown:i + cols}[e.key];
  if (tiles[j]){ e.preventDefault(); tiles[j].focus(); tiles[j].scrollIntoView({block:'nearest'}); }
});

// ---------------------------------------------------------------- Mitspieler (gelten für alle Partyspiele)
function renderPlayers(){
  if (!window.Hub){ $('players').textContent = ''; return; }
  const P = Hub.party;
  $('players').innerHTML = P.all().map(p => `<button class="player ${p.on && p.name.trim() ? '' : 'off'}" data-i="${p.idx}" style="--pc:${p.color}" title="Antippen: mitspielen an/aus">
      <span>${p.avatar}</span>${esc(p.name || '–')}</button>`).join('') + `<button class="btn sm" id="pEdit">✏️ Bearbeiten</button>`;
  $('players').querySelectorAll('.player').forEach(b => b.onclick = () => { const p = P.data.players[+b.dataset.i]; p.on = !p.on; P.save(); renderPlayers(); });
  $('pEdit').onclick = openPlayers;
}
function openPlayers(){
  const P = Hub.party;
  const rows = () => {
    $('dlgRows').innerHTML = P.all().map(p => `<div class="prow" style="--pc:${p.color}" data-i="${p.idx}">
        <button class="av" data-a="av" title="Anderes Tier">${p.avatar}</button><button class="col" data-a="col" title="Andere Farbe"></button>
        <input type="text" value="${esc(p.name)}" maxlength="16" placeholder="Name"><button class="btn sm" data-a="del" title="Entfernen">✕</button></div>`).join('');
    $('dlgRows').querySelectorAll('.prow').forEach(r => {
      const p = P.data.players[+r.dataset.i];
      r.querySelector('input').oninput = e => { p.name = e.target.value; P.save(); };
      r.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
        if (b.dataset.a === 'av') p.av = (p.av + 1) % P.AVATARS.length;
        if (b.dataset.a === 'col') p.col = (p.col + 1) % P.COLORS.length;
        if (b.dataset.a === 'del') P.data.players.splice(+r.dataset.i, 1);
        P.save(); rows();
      });
    });
    $('dlgAdd').disabled = P.data.players.length >= 8;
  };
  $('dlgAdd').onclick = () => { const n = P.data.players.length; P.data.players.push({name:'', col:n % P.COLORS.length, av:n % P.AVATARS.length, on:true}); P.save(); rows();
    const ins = $('dlgRows').querySelectorAll('input'); ins[ins.length - 1].focus(); };
  $('dlgOk').onclick = () => $('dlg').close();
  $('dlg').onclose = renderPlayers;
  rows(); $('dlg').showModal();
}

// ---------------------------------------------------------------- Uhr
function tick(){
  const d = new Date();
  $('uhr').textContent = d.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
  $('datum').textContent = d.toLocaleDateString('de-DE', {weekday:'long', day:'numeric', month:'long'});
}
setInterval(tick, 15000); tick();

// ---------------------------------------------------------------- App: Stand, neue Spiele, Updates
function renderStatus(s){
  $('fVersion').textContent = 'Spielhalle ' + s.version;
  $('fStand').textContent = s.datum ? 'Spiele vom ' + s.datum : '';
  $('fHinweis').textContent = s.hinweis || '';
  $('suchen').disabled = !!s.suche;
  $('suchen').textContent = s.suche ? '⏳ Suche …' : '🔄 Nach neuen Spielen suchen';
  $('bNeu').classList.toggle('on', !!s.neu);
  $('bApp').classList.toggle('on', !!s.appUpdate);
  $('bAppText').textContent = s.appUpdate ? `Version ${s.appUpdate} ist da und wird beim Neustart eingesetzt.` : '';
}
const status = () => fetch('/__status', {cache:'no-store'}).then(r => r.json()).then(s => { renderStatus(s); return s; });
if (APP){
  status().catch(() => {});
  setInterval(() => status().catch(() => {}), 20000);
  $('suchen').onclick = async () => {
    renderStatus(await (await fetch('/__suchen', {method:'POST'})).json());
    for (let i = 0; i < 60; i++){ await new Promise(r => setTimeout(r, 1000)); const s = await status(); if (!s.suche) break; }
  };
  $('neuLaden').onclick = () => fetch('/__gesehen', {cache:'no-store'}).finally(() => location.reload());
  $('neuStart').onclick = () => { $('neuStart').disabled = true; $('neuStart').textContent = 'Startet neu …'; fetch('/__neustart', {method:'POST'}).catch(() => {}); };
} else {
  $('suchen').hidden = true;
  $('fHinweis').textContent = 'Tipp: Mit Spielhalle.exe startest du die Spielhalle als App – mit automatisch neuen Spielen.';
}

// ---------------------------------------------------------------- Einstellungen
// Spiel-Einstellungen liegen in hub.js (gelten für alle Spiele), App-Einstellungen in der App selbst
let appSet = null;
function applyTv(){ if (window.Hub) Hub.applyTV(); }
function renderSettings(){
  if (!window.Hub) return;
  const S = Hub.settings, P = Hub.party.data;
  $('sName').value = S.name || '';
  $('sName').oninput = e => { S.name = e.target.value.trim() || 'Spieler'; Hub.saveSettings(); };
  $('sFarben').innerHTML = Object.entries(Hub.ACCENTS).map(([k, v]) => `<button class="sw ${S.accent === k ? 'on' : ''}" data-k="${k}" style="background:${v[0]}" title="${k}"></button>`).join('');
  $('sFarben').querySelectorAll('.sw').forEach(b => b.onclick = () => { S.accent = b.dataset.k; Hub.saveSettings(); renderSettings(); });
  [['sMaster', 'vMaster', 'master'], ['sSfx', 'vSfx', 'sfx'], ['sMusic', 'vMusic', 'music']].forEach(([i, v, k]) => {
    $(i).value = Math.round((S[k] == null ? 1 : S[k]) * 100); $(v).textContent = $(i).value + ' %';
    $(i).oninput = e => { S[k] = e.target.value / 100; $(v).textContent = e.target.value + ' %'; Hub.saveSettings(); };
    $(i).onchange = () => { try { Hub.sfx('click'); } catch(e){} };
  });
  $('sTv').classList.toggle('on', !!P.tv);
  $('sTv').onclick = () => { P.tv = !P.tv; Hub.party.save(); applyTv(); renderSettings(); };
  $('sTvGroesse').innerHTML = [[1.15, 'Etwas größer'], [1.3, 'Groß'], [1.5, 'Riesig']].map(([v, l]) => `<button data-v="${v}" class="${P.tv && P.tvScale == v ? 'on' : ''}">${l}</button>`).join('');
  $('sTvGroesse').querySelectorAll('button').forEach(b => b.onclick = () => { P.tvScale = +b.dataset.v; P.tv = true; Hub.party.save(); applyTv(); renderSettings(); });
  $('sRuhig').classList.toggle('on', !!S.reduceMotion);
  $('sRuhig').onclick = () => { S.reduceMotion = !S.reduceMotion; Hub.saveSettings(); renderSettings(); };
  // App
  $('sAppTeil').hidden = !appSet;
  if (appSet){
    $('sVollbild').classList.toggle('on', !!appSet.vollbild);
    $('sAutostart').classList.toggle('on', !!appSet.autostart);
    const setApp = (k, on) => fetch(`/__einstellungen?${k}=${on ? 1 : 0}`, {method:'POST'}).then(r => r.json()).then(j => { appSet = j; renderSettings(); }).catch(() => {});
    $('sVollbild').onclick = () => setApp('vollbild', !appSet.vollbild);
    $('sAutostart').onclick = () => setApp('autostart', !appSet.autostart);
  }
}
async function openSettings(){
  if (APP){
    try { const r = await fetch('/__einstellungen', {cache:'no-store'}); appSet = r.ok ? await r.json() : null; } catch(e){ appSet = null; }
    $('sUpdTeil').hidden = false;
    status().then(s => {
      $('sVersion').textContent = 'Version ' + s.version + (s.appUpdate ? ` – Version ${s.appUpdate} wird beim nächsten Start eingesetzt` : ' – aktuell');
      $('sStand').textContent = (s.datum ? 'Stand vom ' + s.datum : '') + (s.hinweis ? ' · ' + s.hinweis : '');
    }).catch(() => {});
  }
  renderSettings();
  $('set').showModal();
}
$('setBtn').onclick = openSettings;
$('setOk').onclick = () => $('set').close();
$('set').onclose = () => { renderPlayers(); renderGrid(); };
$('sSuchen').onclick = () => { $('suchen').click(); $('set').close(); };
$('sExport').onclick = () => {
  const blob = new Blob([JSON.stringify(Hub.exportAll(), null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'Spielhalle-Spielstaende-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
};
$('sImport').onclick = () => $('sImportFile').click();
$('sImportFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { Hub.importAll(JSON.parse(r.result)); alert('Spielstände geladen.'); location.reload(); }
    catch(err){ alert('Diese Datei ist keine Spielhallen-Sicherung.'); }
  };
  r.readAsText(f);
  e.target.value = '';
};
$('sReset').onclick = () => {
  if (!confirm('Wirklich ALLE Spielstände, Rekorde, Chips und Einstellungen löschen?')) return;
  try { localStorage.clear(); } catch(e){}
  location.reload();
};
if (!window.Hub) $('setBtn').hidden = true;

renderPlayers();
loadGames();
</script>
</body>
</html>
